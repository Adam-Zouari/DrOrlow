<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Meet Dr Orlow's playful side in a little story about a button you probably shouldn't touch.">
    <link rel="icon" href="/assets/images/Octopus1.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="/assets/css/policy.css">
    <script src="/assets/js/policy.js" defer></script>
    <title>Policy | Dr Orlow</title>
</head>
<body class="viewport-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header id="header">
        <h1><a href="Home.html">Dr Orlow</a></h1>
        <img src="/assets/images/Octopus1.png" alt="" width="220" height="100">
    </header>
    <main id="main-content" class="policy-page" tabindex="-1">
        <h2 class="sr-only">A playful warning from Dr Orlow</h2>
        <div id="policy-story">
            <div id="warning1" class="warning-scene" data-policy-scene>
                <button id="button1" class="button" type="button" data-policy-next="warning2">Do not touch this button</button>
            </div>
            <div id="warning2" class="warning-scene" data-policy-scene hidden>
                <button id="button2" class="button" type="button" data-policy-next="warning3">I told you not to touch it...</button>
            </div>
            <div id="warning3" class="warning-scene" data-policy-scene hidden>
                <button id="button3" class="button" type="button" data-policy-next="angry-scene">Last warning...</button>
            </div>
            <div id="angry-scene" class="character-scene" data-policy-scene tabindex="-1" role="group" aria-labelledby="angry again" hidden>
                <img src="/assets/images/angryorlow.png" id="angryorlow" class="character" alt="Dr Orlow looking angry" width="577" height="433">
                <div class="character-message" role="status">
                    <p id="angry">I am angry at you...<br>So, so angry.</p>
                    <p id="again">Do not do that again...</p>
                </div>
                <button id="button4" class="button" type="button" data-policy-next="happy-scene">I apologize</button>
            </div>
            <div id="happy-scene" class="character-scene" data-policy-scene tabindex="-1" role="group" aria-labelledby="happy1 happy2" hidden>
                <img src="/assets/images/DrOrlow.png" id="DrOrlow" class="character" alt="Dr Orlow smiling again" width="577" height="433">
                <div class="character-message" role="status">
                    <p id="happy1">Apology accepted.</p>
                    <p id="happy2">Don't worry, my friend...<br>I can't stay angry at you ^-^<br>I love you.</p>
                </div>
                <a href="Home.html" id="button5" class="button">I love you too</a>
            </div>
        </div>
        <noscript><p class="script-note">Enable JavaScript to play through Dr Orlow's button story.</p></noscript>
    </main>
    <footer id="footer" aria-label="Main navigation" role="navigation">
        <a href="Home.html">Home</a>
        <a href="About me.html">About me</a>
        <a href="join me.html">Join me</a>
    </footer>
</body>
</html>
